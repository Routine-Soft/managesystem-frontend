<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Portal do cliente: o app instalado de lá abre no portal (o manifesto precisa estar certo já no carregamento).
      if (location.hash.indexOf('#/portal') === 0) document.querySelector('link[rel="manifest"]').href = '/manifest-portal.webmanifest'
    </script>
    <meta name="apple-mobile-web-app-title" content="ServerFall" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>ServerFall · Monitoramento de servidores, domínios e SSL</title>
    <meta name="description" content="Monitore servidores, domínios, SSL e atualizações num só painel, receba alertas no Telegram e dê ao seu cliente um portal para acompanhar e pagar a mensalidade." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('theme-preference');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'system';
        var i = localStorage.getItem('idioma') || ((navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');
        document.documentElement.lang = i === 'en' ? 'en' : 'pt-BR';
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
